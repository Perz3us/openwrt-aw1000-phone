name: Build

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      noobwrt:
        description: NoobWRT release tag, empty for the latest
        required: false
      openwrt:
        description: Official OpenWrt version, empty for the latest stable
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sdk: ${{ steps.ref.outputs.sdk }}
      flavors: ${{ steps.ref.outputs.flavors }}
      tag: ${{ steps.nw.outputs.tag }}
      openwrt: ${{ steps.nw.outputs.openwrt }}
      hash: ${{ steps.nw.outputs.hash }}
      ow_version: ${{ steps.ow.outputs.version }}
      ow_kernel: ${{ steps.ow.outputs.kernel }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq squashfs-tools
      - id: nw
        env:
          NOOBWRT: ${{ inputs.noobwrt }}
        run: |
          sh scripts/noobwrt_kernel.sh "$NOOBWRT" | tee -a "$GITHUB_OUTPUT"
      - id: ow
        env:
          OPENWRT: ${{ inputs.openwrt }}
        run: |
          sh scripts/official_kernel.sh "$OPENWRT" | tee -a "$GITHUB_OUTPUT"
      - id: ref
        env:
          HASH: ${{ steps.nw.outputs.hash }}
          OW: ${{ steps.ow.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sdk=$(sed -n 's/^SDK_VER=.*:-\([0-9.]*\)}$/\1/p' scripts/build.sh)" >> "$GITHUB_OUTPUT"
            echo 'flavors=["noobwrt","official"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft or .tag_name == \"$REF\") | .assets[].name")
          SDK=$(git show "$REF:scripts/build.sh" | sed -n 's/^SDK_VER=.*:-\([0-9.]*\)}$/\1/p')
          F=
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! echo "$ASSETS" | grep -q "kernel-$(echo "$HASH" | cut -c1-8)\.apk"; then
            F='"noobwrt"'
          else
            echo "$REF already has a kmod for this NoobWRT kernel"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { [ "$OW" != "$SDK" ] && ! echo "$ASSETS" | grep -qF "official-openwrt-$OW.apk"; }; then
            F="${F:+$F,}\"official\""
          else
            echo "$REF already has a kmod for OpenWrt $OW"
          fi
          echo "flavors=[$F]" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.flavors != '[]'
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      matrix:
        flavor: ${{ fromJSON(needs.check.outputs.flavors) }}
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential perl python3 python3-setuptools \
            file rsync gawk unzip bzip2 xz-utils zstd bison flex libncurses-dev wget git ca-certificates \
            swig gettext libelf-dev
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - env:
          REF: ${{ needs.check.outputs.ref }}
          SDK_VER: ${{ matrix.flavor == 'noobwrt' && needs.check.outputs.openwrt || (github.event_name != 'push' && needs.check.outputs.ow_version || '') }}
          HASH: ${{ matrix.flavor == 'noobwrt' && needs.check.outputs.hash || '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout "$REF" -- kernel openwrt fxsd
          ln -s "$GITHUB_WORKSPACE" /work
          mkdir -p /cache
          [ -n "$SDK_VER" ] || unset SDK_VER
          sh scripts/build.sh /work/kernel/aw1000-fxs ${{ matrix.flavor }}
          sh scripts/build_pkgs.sh ${HASH:+"$HASH"}
          sh scripts/check_repro.sh ${HASH:+"$HASH"}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor }}
          path: dist/*.apk

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ needs.check.outputs.ref }}
      TAG: ${{ needs.check.outputs.tag }}
      HASH: ${{ needs.check.outputs.hash }}
      OW: ${{ needs.check.outputs.ow_version }}
      SDK: ${{ needs.check.outputs.sdk }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: a
      - run: |
          H8=$(echo "$HASH" | cut -c1-8)
          [ "$GITHUB_EVENT_NAME" = push ] && OW=$SDK
          kver() { basename "$1" | sed 's/^kmod-aw1000-fxs-[0-9]*\.[0-9]*\.[0-9]*\.\(.*\)-r[0-9]*\.apk$/\1/'; }
          mkdir out
          for f in a/noobwrt/kmod-*.apk; do
            [ -f "$f" ] && cp "$f" "out/kmod-aw1000-fxs-$(kver "$f")-noobwrt-$TAG-kernel-$H8.apk"
          done
          for f in a/official/kmod-*.apk; do
            [ -f "$f" ] && cp "$f" "out/kmod-aw1000-fxs-$(kver "$f")-official-openwrt-$OW.apk"
          done
          ls -l out
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            find a/official -name '*.apk' ! -name 'kmod-*' -exec cp {} out/ \;
            gh release create "$REF" --repo "$GITHUB_REPOSITORY" --draft --title "$REF" --notes "" out/*.apk
          else
            gh release upload "$REF" --repo "$GITHUB_REPOSITORY" --clobber out/*.apk
          fi
